name: Quick Checks

on:
  push:
    branches: [overlay]
  pull_request:
    branches: [overlay]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  ONNXRUNTIME_NODE_INSTALL: skip
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci --prefer-offline --no-audit --no-fund

      - name: Build generated declarations
        run: npm run build:server

      - name: Check formatting, lint, and types
        run: npm run release:fork:check
