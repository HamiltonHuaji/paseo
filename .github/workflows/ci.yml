name: Quick Checks

on:
  push:
    branches: [overlay]
  pull_request:
    branches: [overlay]
  merge_group:
  workflow_dispatch:

concurrency:
  group: quick-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  ONNXRUNTIME_NODE_INSTALL: skip
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci --prefer-offline --no-audit --no-fund

      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci --prefer-offline --no-audit --no-fund

      - name: Build generated declarations
        run: npm run build:server

      - name: Typecheck
        run: npm run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci --prefer-offline --no-audit --no-fund

      - name: Build unit-test dependencies
        run: npm run build:app-deps

      - name: Run app Node unit tests
        run: npm run test --workspace=@getpaseo/app -- --project unit

      - name: Run SDK Node unit tests
        run: |
          npm run test --workspace=@getpaseo/protocol
          npm run test --workspace=@getpaseo/client
          npm run test --workspace=@getpaseo/highlight
